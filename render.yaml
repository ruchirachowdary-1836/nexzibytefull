services:
  - type: web
    name: techtalk-backend
    env: python
    buildCommand: pip install -r requirements.txt
    # Render free services cannot use pre-deploy commands, so migrate at start.
    startCommand: sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
