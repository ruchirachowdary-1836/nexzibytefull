services:
  - type: web
    name: techtalk-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render free services cannot use pre-deploy commands, so migrate at start.
    startCommand: sh -c 'python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://techtalk-frontend-acvb.onrender.com
      - key: FRONTEND_URL
        value: https://techtalk-frontend-acvb.onrender.com
      - key: VISITOR_PROMOTION_DATE
        sync: false
      - key: NEON_AUTH_JWKS_URL
        value: https://ep-mute-resonance-ay0g7clj.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth/.well-known/jwks.json
      - key: NEON_AUTH_ISSUER
        value: https://ep-mute-resonance-ay0g7clj.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth
      - key: NEON_AUTH_AUDIENCE
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
  - type: web
    name: techtalk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /register
        destination: /index.html
      - type: rewrite
        source: /verify-email
        destination: /index.html
      - type: rewrite
        source: /profile
        destination: /index.html
      - type: rewrite
        source: /dashboard
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://techtalk-backend-shob.onrender.com
      - key: VITE_AUTH_PROVIDER
        value: neon
      - key: VITE_NEON_DATA_API_URL
        value: https://ep-mute-resonance-ay0g7clj.apirest.c-5.us-east-2.aws.neon.tech/neondb/rest/v1
      - key: VITE_NEON_AUTH_URL
        value: https://ep-mute-resonance-ay0g7clj.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth
      - key: VITE_NEON_AUTH_CALLBACK_URL
        value: https://techtalk-frontend-acvb.onrender.com/
