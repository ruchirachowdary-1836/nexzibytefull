services:
  - type: web
    name: techtalk-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render free services cannot use pre-deploy commands, so migrate at start.
    startCommand: sh -c 'python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://techtalk-frontend-acvb.onrender.com
      - key: FRONTEND_URL
        value: https://techtalk-frontend-acvb.onrender.com
      - key: GOOGLE_CLIENT_ID
        value: 871004671345-2belb4f6tdfn88t6d3q16ne1atjr02tn.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://techtalk-backend-shob.onrender.com/auth/google/callback
  - type: web
    name: techtalk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://techtalk-backend-shob.onrender.com
